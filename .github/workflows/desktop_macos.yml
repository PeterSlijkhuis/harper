name: Harper Desktop for macOS

on:
  push:
    branches: ["master", "main", "development"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-macos:
    name: just build-desktop-macos-unsigned
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: build-desktop-macos
          workspaces: |
            . -> target
            harper-desktop/src-tauri -> target
      - uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # main
      - name: Install `wasm-pack`
        run: cargo binstall wasm-pack --force --no-confirm
      - name: Install `tauri-cli`
        run: cargo binstall tauri-cli --force --no-confirm
      # Unsigned: macOS asks you to approve the app on first launch (right-click, Open).
      - name: Build Harper Desktop for macOS
        run: just build-desktop-macos-unsigned
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: harper-desktop-macos-universal
          path: harper-desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
